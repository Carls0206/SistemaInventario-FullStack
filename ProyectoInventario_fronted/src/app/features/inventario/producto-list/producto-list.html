<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Productos</h1>
  <button mat-flat-button color="primary" (click)="openCreate()">Nuevo producto</button>
</div>

@if (error) {
  <div class="alert alert-danger py-2 mb-3" role="alert">{{ error }}</div>
}

<mat-card class="table-card">
  <mat-card-content>
    @if (loading) {
      <div class="loading">
        <mat-spinner diameter="36"></mat-spinner>
      </div>
    } @else {
      <div class="table-responsive">
        <table mat-table [dataSource]="productos" class="w-100">
          <ng-container matColumnDef="codigo">
            <th mat-header-cell *matHeaderCellDef>Código</th>
            <td mat-cell *matCellDef="let producto">{{ producto.codigo }}</td>
          </ng-container>

          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let producto">{{ producto.nombre }}</td>
          </ng-container>

          <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripción</th>
            <td mat-cell *matCellDef="let producto">
              {{ producto.descripcion || 'Sin descripción' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="precio">
            <th mat-header-cell *matHeaderCellDef>Precio</th>
            <td mat-cell *matCellDef="let producto">{{ producto.precio | number: '1.2-2' }}</td>
          </ng-container>

          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let producto">
              <mat-slide-toggle
                [checked]="producto.estado === 'A'"
                (change)="toggleEstado(producto)"
                color="primary"
                aria-label="Cambiar estado"
              ></mat-slide-toggle>
            </td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef class="text-end">Acciones</th>
            <td mat-cell *matCellDef="let producto" class="text-end">
              <div class="d-inline-flex gap-1">
                <button mat-icon-button color="primary" (click)="openEdit(producto)" aria-label="Editar">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="remove(producto)" aria-label="Eliminar">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell text-center text-muted py-4" [attr.colspan]="displayedColumns.length">
              No hay productos registrados
            </td>
          </tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
