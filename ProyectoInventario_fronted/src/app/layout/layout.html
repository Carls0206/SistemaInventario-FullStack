<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="sidenav"
  >
    <mat-toolbar color="primary">Inventario</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/productos" routerLinkActive="active">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a mat-list-item routerLink="/productos/nuevo" routerLinkActive="active">
        <mat-icon matListItemIcon>add_box</mat-icon>
        <span matListItemTitle>Nuevo producto</span>
      </a>
      <a mat-list-item (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Salir</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="app-title">Gestión de Inventario</span>
    </mat-toolbar>

    <div class="page-content container-fluid py-3">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
