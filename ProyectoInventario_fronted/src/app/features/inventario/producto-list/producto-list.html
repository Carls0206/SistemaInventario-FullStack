<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Productos</h2>
  <a class="btn btn-primary" routerLink="/productos/nuevo">Nuevo producto</a>
</div>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

@if (loading) {
  <div class="text-center py-4">
    <div class="spinner-border" role="status"></div>
  </div>
} @else {
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Activo</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (p of productos; track p.id) {
          <tr>
            <td>{{ p.codigo }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.descripcion }}</td>
            <td>
              <span class="badge" [class.bg-success]="p.activo" [class.bg-secondary]="!p.activo">
                {{ p.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-primary me-2" [routerLink]="['/productos', p.id, 'editar']">
                Editar
              </a>
              <button class="btn btn-sm btn-outline-danger" (click)="remove(p.id)">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center text-muted">Sin productos</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
