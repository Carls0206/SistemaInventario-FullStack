<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="sidenav"
  >
    <div class="sidenav-title">Inventario</div>

    <mat-nav-list>
      <a mat-list-item routerLink="/productos" routerLinkActive="active">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a mat-list-item routerLink="/lotes" routerLinkActive="active">
        <mat-icon matListItemIcon>view_module</mat-icon>
        <span matListItemTitle>Lotes</span>
      </a>
      <a mat-list-item routerLink="/producto-lotes" routerLinkActive="active">
        <mat-icon matListItemIcon>inventory</mat-icon>
        <span matListItemTitle>Inv. de productos</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Abrir menú">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span>Sistema de Inventario</span>
      <span class="spacer"></span>

      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        Salir
      </button>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
